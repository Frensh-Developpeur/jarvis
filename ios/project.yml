name: Jarvis
options:
  bundleIdPrefix: com.sebckyser
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: UNB8SQ689Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources: [Jarvis, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebckyser.jarvis
        INFOPLIST_FILE: Jarvis/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jarvis/Jarvis.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: JarvisWidget
        embed: true
  JarvisWidget:
    type: app-extension
    platform: iOS
    sources: [JarvisWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebckyser.jarvis.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"
        INFOPLIST_FILE: JarvisWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: JarvisWidget/JarvisWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
